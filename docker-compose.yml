version: "3.9"

# ─── DocMind local development stack ─────────────────────────────────────────
#
# Services:
#   postgres   — PostgreSQL 16 + pgvector extension
#   redis      — Upstash-compatible Redis (for rate limiting + conv history)
#   backend    — Python FastAPI ingestion service
#   frontend   — Next.js app (optional — use `npm run dev` outside Docker instead)
#
# Usage:
#   docker compose up -d postgres redis   # infra only (recommended during dev)
#   docker compose up -d                  # full stack
#   docker compose down -v                # destroy including volumes
#
# Environment:
#   Copy .env.example to .env and fill in values.
#   The backend reads its own backend/.env.example → backend/.env.

services:

  # ── PostgreSQL 16 + pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations on first start
      - ./drizzle/0001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Python ingestion backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override DB URL to use the compose service name
      DATABASE_URL: postgresql+asyncpg://docmind:docmind@postgres:5432/docmind
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Next.js frontend (optional — run outside Docker for hot reload) ─────────
  # Comment this out during active frontend development and use `npm run dev`
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: docmind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      # Override Redis/Postgres URLs to use compose service names
      # UPSTASH_REDIS_REST_URL is for Upstash HTTP API — use host.docker.internal
      # for local redis you'd need @upstash/redis with REST adapter pointed at redis
      # Simplest: keep using Upstash cloud even locally for Redis
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
